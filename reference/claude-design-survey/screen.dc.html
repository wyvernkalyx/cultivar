<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
@keyframes scPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
@keyframes scSpin { to { transform: rotate(360deg) } }
@keyframes scPetal { 0%{transform:scaleY(.08);opacity:0} 16%{opacity:1} 44%{transform:scaleY(1);opacity:1} 82%{transform:scaleY(1);opacity:1} 100%{transform:scaleY(.08);opacity:0} }
@keyframes scCalyx { 0%{transform:scale(.2);opacity:0} 40%{transform:scale(1);opacity:1} 100%{transform:scale(1);opacity:1} }
@keyframes scRise { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
@keyframes scGlow { 0%,100%{opacity:.35} 50%{opacity:.7} }
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:{{ bg }};color:{{ text }};font-family:'Sora',-apple-system,system-ui,sans-serif;box-shadow:0 0 0 10px #050505, 0 30px 70px -20px rgba(0,0,0,.8);flex:0 0 auto;">

  <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-size:16px;font-weight:600;z-index:5;">
    <span>2:30</span>
    <span style="display:flex;align-items:center;gap:7px;">
      <span style="display:inline-flex;align-items:flex-end;gap:2px;height:11px;">
        <i style="width:3px;height:5px;background:{{ text }};border-radius:1px;display:inline-block;"></i>
        <i style="width:3px;height:7px;background:{{ text }};border-radius:1px;display:inline-block;"></i>
        <i style="width:3px;height:9px;background:{{ text }};border-radius:1px;display:inline-block;"></i>
        <i style="width:3px;height:11px;background:{{ text }};border-radius:1px;display:inline-block;"></i>
      </span>
      <span style="width:22px;height:11px;border:1.5px solid {{ text }};border-radius:3px;position:relative;display:inline-block;">
        <i style="position:absolute;inset:1.5px;right:6px;background:#3ddc6a;border-radius:1px;display:block;"></i>
      </span>
    </span>
  </div>

  <div style="position:absolute;inset:54px 26px 0 26px;display:flex;flex-direction:column;">

    <button style="align-self:flex-start;margin-top:8px;background:{{ controlBg }};color:{{ text }};border:none;border-radius:22px;height:44px;padding:0 22px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;">
      <span style="font-size:18px;line-height:1;">{{ controlIcon }}</span>{{ control }}
    </button>

    <div style="margin-top:26px;opacity:{{ headerOpacity }};transition:opacity .3s;">
      <div style="font-size:15px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:{{ subtext }};">{{ brand }}</div>
      <div style="font-size:38px;font-weight:700;line-height:1.02;letter-spacing:-.01em;margin-top:8px;text-wrap:balance;">{{ strain }}</div>
      <sc-if value="{{ question }}" hint-placeholder-val="Rate this Session">
        <div style="font-size:23px;font-weight:500;line-height:1.15;margin-top:20px;color:{{ accent }};">{{ question }}</div>
      </sc-if>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 4px;">
      <sc-if value="{{ explainer }}" hint-placeholder-val="x">
        <p style="font-size:16px;line-height:1.55;color:{{ subtext }};max-width:300px;text-wrap:pretty;margin:0;font-family:'Newsreader',Georgia,serif;font-style:italic;">{{ explainer }}</p>
      </sc-if>
      <sc-if value="{{ showBloom }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;gap:32px;margin:0 auto;">
          <div style="position:relative;width:120px;height:120px;">
            <div style="position:absolute;inset:0;border-radius:50%;background:{{ accent }};filter:blur(26px);opacity:.4;animation:scGlow 3s ease-in-out infinite;"></div>
            <div style="position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;transform-origin:50% 50%;">
              {{ petals }}
              <div style="position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:{{ text }};animation:scCalyx 3.4s ease-out infinite;"></div>
            </div>
          </div>
          <div style="text-align:center;animation:scRise .6s ease-out .5s both;">
            <div style="font-size:26px;font-weight:600;">Logged.</div>
            <div style="font-size:15px;color:{{ subtext }};margin-top:6px;font-family:'Newsreader',serif;font-style:italic;">On the shelf with the rest.</div>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="padding-bottom:38px;display:flex;flex-direction:column;gap:12px;">

      <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:12px;background:{{ errBg }};border:1px solid {{ errBorder }};border-radius:16px;padding:14px 18px;margin-bottom:4px;animation:scRise .3s ease-out both;">
          <span style="width:22px;height:22px;border-radius:50%;background:{{ errDot }};color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;">!</span>
          <span style="font-size:15px;font-weight:500;color:{{ text }};line-height:1.3;">Couldn't save — check your connection</span>
        </div>
      </sc-if>

      <sc-for list="{{ buttons }}" as="b" hint-placeholder-count="3">
        <button style="position:relative;width:100%;height:70px;border-radius:20px;border:none;background:{{ b.bg }};color:{{ b.fg }};font-family:inherit;font-size:20px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:{{ b.opacity }};overflow:hidden;">
          <sc-if value="{{ b.stripe }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;left:0;top:0;bottom:0;width:5px;background:{{ b.color }};"></span>
          </sc-if>
          <sc-if value="{{ b.saving }}" hint-placeholder-val="{{ false }}">
            <span style="width:20px;height:20px;border-radius:50%;border:2.5px solid {{ b.fg }};border-top-color:transparent;animation:scSpin .7s linear infinite;margin-right:12px;display:inline-block;"></span>
          </sc-if>
          {{ b.label }}
        </button>
      </sc-for>

      <sc-if value="{{ hasSkip }}" hint-placeholder-val="{{ false }}">
        <button style="width:100%;height:70px;border-radius:20px;border:1.5px dashed {{ skipBorder }};background:transparent;color:{{ text }};font-family:inherit;font-size:20px;font-weight:600;cursor:pointer;">Skip</button>
      </sc-if>

      <sc-if value="{{ showClose }}" hint-placeholder-val="{{ false }}">
        <button style="width:100%;height:70px;border-radius:20px;border:none;background:{{ accent }};color:#08120b;font-family:inherit;font-size:20px;font-weight:700;cursor:pointer;">Close</button>
      </sc-if>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:410,&quot;height&quot;:864},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;warm&quot;,&quot;cool&quot;,&quot;moody&quot;],&quot;default&quot;:&quot;warm&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Animal House&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;strain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;RAINBOW RUNTZ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;question&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;explainer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;control&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Close&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;saving&quot;,&quot;error&quot;,&quot;bloom&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;activeIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;tsType&quot;:&quot;number&quot;},&quot;hasSkip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showInput&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;buttons&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const themes = {
      warm: { bg:'#100e0b', surface:'#221d16', surfaceHi:'#2b251c', text:'#f3ede1', subtext:'#9a9081', accent:'oklch(0.76 0.12 150)', control:'#221d16', input:'#2b251c' },
      cool: { bg:'#000000', surface:'#17191c', surfaceHi:'#202327', text:'#f5f7f9', subtext:'#838a92', accent:'oklch(0.80 0.12 168)', control:'#17191c', input:'#202327' },
      moody:{ bg:'#090d0a', surface:'#131b15', surfaceHi:'#1b241d', text:'#e9f1ea', subtext:'#7f8f84', accent:'oklch(0.82 0.13 152)', control:'#131b15', input:'#1b241d' },
    };
    const t = themes[p.theme] || themes.warm;
    const tierColors = ['oklch(0.78 0.13 150)','oklch(0.80 0.11 128)','oklch(0.82 0.10 96)','oklch(0.74 0.12 56)','oklch(0.66 0.13 33)'];

    const mode = p.mode || 'normal';
    const activeIndex = p.activeIndex == null ? -1 : p.activeIndex;
    const raw = Array.isArray(p.buttons) ? p.buttons : [];
    const buttons = raw.map((b, i) => {
      const hasTier = b.tier != null;
      const isActive = i === activeIndex;
      const saving = mode === 'saving' && isActive;
      let opacity = 1;
      if (mode === 'saving' && !isActive) opacity = 0.32;
      return {
        label: saving ? 'Saving…' : b.label,
        bg: t.surface, fg: t.text,
        color: hasTier ? tierColors[b.tier] : '',
        stripe: hasTier, saving, opacity,
      };
    });

    const petals = Array.from({length:6}).map((_,i)=>
      React.createElement('div',{key:i,style:{
        position:'absolute',left:'50%',top:'50%',width:0,height:0,transform:`rotate(${i*60}deg)`,
      }},
        React.createElement('div',{style:{
          position:'absolute',left:'-12px',top:'-56px',width:'24px',height:'48px',
          borderRadius:'50% 50% 50% 50% / 62% 62% 38% 38%',
          background:t.accent,transformOrigin:'50% 100%',
          animation:'scPetal 3.4s cubic-bezier(.2,.8,.3,1) infinite',
          animationDelay:(i*0.07)+'s',
        }})
      ));

    return {
      ...t,
      controlBg: t.control, inputBorder: t.surfaceHi, input: t.input,
      control: p.control || 'Close',
      controlIcon: (p.control === 'Back') ? '‹' : '✕',
      brand: p.brand || 'Animal House',
      strain: p.strain || 'RAINBOW RUNTZ',
      question: p.question || '',
      explainer: (mode==='bloom') ? '' : (p.explainer || ''),
      headerOpacity: mode === 'saving' ? 0.4 : 1,
      buttons: (mode==='bloom' || p.showInput) ? [] : buttons,
      hasSkip: !!p.hasSkip && mode !== 'bloom' && !p.showInput,
      showError: mode === 'error',
      showBloom: mode === 'bloom',
      showInput: !!p.showInput,
      showClose: !!p.showInput,
      errBg: t.surfaceHi, errBorder: 'oklch(0.66 0.13 33)', errDot: 'oklch(0.72 0.14 45)',
      skipBorder: t.surfaceHi,
      petals,
    };
  }
}
</script>
</body>
</html>
